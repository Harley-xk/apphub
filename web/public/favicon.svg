<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!--
    apphub 品牌图形「三花聚心」favicon 简化变体（16px 下三花结构退化为噪点，固定用单雪花）
    图形与色彩规格唯一出处：docs/前端/品牌与Logo设计.md（改图形先改文档）
  -->
  <style>
    .grad-a { stop-color: #9fd0f0; }
    .grad-b { stop-color: #38a3e8; }
    .frame { fill: rgba(86, 182, 240, 0.08); }
    @media (prefers-color-scheme: dark) {
      .grad-a { stop-color: #c9e6f8; }
      .grad-b { stop-color: #5cb4ec; }
      .frame { fill: rgba(86, 182, 240, 0.12); }
    }
  </style>
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="grad-a"/>
      <stop offset="1" class="grad-b"/>
    </linearGradient>
  </defs>
  <path class="frame" d="M40 7 L65 21.5 L65 50.5 L40 65 L15 50.5 L15 21.5 Z" stroke="url(#lg)" stroke-width="3.5"/>
  <g stroke="url(#lg)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path transform="rotate(30 40 36)"
      d="M40 17 L40 30 M40 21 L36.4 17.4 M40 21 L43.6 17.4 M40 55 L40 42 M40 51 L36.4 54.6 M40 51 L43.6 54.6"/>
    <path transform="rotate(90 40 36)"
      d="M40 17 L40 30 M40 21 L36.4 17.4 M40 21 L43.6 17.4 M40 55 L40 42 M40 51 L36.4 54.6 M40 51 L43.6 54.6"/>
    <path transform="rotate(150 40 36)"
      d="M40 17 L40 30 M40 21 L36.4 17.4 M40 21 L43.6 17.4 M40 55 L40 42 M40 51 L36.4 54.6 M40 51 L43.6 54.6"/>
  </g>
  <circle cx="40" cy="36" r="3.2" fill="url(#lg)"/>
</svg>
