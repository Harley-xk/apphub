# n-1 镜像内 nginx：前端静态资源 + /api 反代（由 entrypoint.sh 以 daemon 方式拉起）
# 覆盖 alpine nginx 的 /etc/nginx/http.d/default.conf

# TLS 终止在服务器全局 nginx，本层纯 HTTP——$scheme 恒为 http；
# X-Forwarded-Proto 需透传外层传入值（无外层时回落 $scheme，本地直连容器调试不受影响）
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 与服务器全局 nginx（deploy/nginx-gateway.conf.example）保持一致的上传限制
    client_max_body_size 20m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 带内容 hash 的静态资源：长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 入口页不缓存，保证发版后拿到最新 hash 引用
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 业务接口反代到容器内 NestJS（后端全局前缀 /api，无需 rewrite）
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Swagger（SWAGGER_ENABLED=true 时可达）
    location /api-docs {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
